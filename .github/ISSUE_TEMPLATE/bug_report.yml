name: Ошибка
description: Сообщить о неправильном поведении FlClashM
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Проверьте, нет ли уже такой issue. Одна заявка — одна проблема.
        Заголовок: `fix: наблюдаемая проблема`, на русском, без точки, до 72 символов.
        Например: `fix: VPN не восстанавливается после смены сети`.
        Не публикуйте подписки, токены, ключи, пароли и персональные данные, в том числе во вложениях.
  - type: textarea
    id: actual
    attributes:
      label: Что происходит
      description: Опишите наблюдаемую ошибку и её влияние. При необходимости приложите скриншот.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Перечислите шаги. Если точный сценарий неизвестен, опишите условия появления ошибки.
      placeholder: |
        1. Запустить VPN с профилем…
        2. Переключиться с Wi-Fi на мобильную сеть…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Как приложение должно вести себя при этих шагах?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Дополнительные сведения
      description: Необязательно. Если это помогает разбору, укажите версию приложения, ОС, устройство, ABI или команду сборки; приложите логи, скриншот или диагностический ZIP. Перед публикацией удалите секреты и персональные данные.
