name: Сообщить об ошибке / Bug report
description: Воспроизводимая проблема в Android-версии FlClashM
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Проверьте [существующие issues](https://github.com/makriq-org/FlClashM/issues?q=is%3Aissue) и используйте последний доступный выпуск своего канала.

        Профиль и логи могут содержать URL подписки, пароли, ключ OlcRTC, токены и адреса частных серверов. Удалите секреты перед публикацией. Не прикладывайте исходный профиль целиком.

  - type: input
    id: version
    attributes:
      label: Версия FlClashM
      description: Точный тег из раздела «О приложении», например v0.10.6-pre5.
      placeholder: v0.10.6-pre5
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Устройство и Android
      description: Модель, версия Android, ABI и прошивка, если известны.
      placeholder: Pixel 8, Android 16, arm64-v8a
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Источник установки
      options:
        - SourceForge
        - GitHub Releases
        - Локальная сборка из исходников
        - Другой источник
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Что произошло
      description: Фактическое поведение, ожидаемый результат и когда проблема появилась.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Короткая последовательность от запуска приложения до сбоя. Укажите, нужен ли обычный профиль, встроенный узел, split tunneling или always-on.
      placeholder: |
        1. Добавить очищенный тестовый профиль…
        2. Выбрать группу…
        3. Включить VPN…
    validations:
      required: true

  - type: textarea
    id: sanitized_config
    attributes:
      label: Очищенный фрагмент профиля
      description: Только минимальный YAML, необходимый для воспроизведения. Замените URL, логины, пароли, ключи и токены.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Очищенный debug-лог
      description: Вставьте относящийся к сбою фрагмент текстом. Удалите URL подписки, заголовки авторизации, пароли, ключи и персональные данные.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждение
      options:
        - label: Я проверил похожие issues и указал точную версию приложения.
          required: true
        - label: Я удалил из профиля и логов секреты и персональные данные.
          required: true
