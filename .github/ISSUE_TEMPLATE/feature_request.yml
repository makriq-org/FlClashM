name: Предложение функции
description: Предложить новую возможность FlClashM
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Проверьте, нет ли уже такого предложения. Одна заявка — одна возможность.
        Заголовок: `feat: добавить …`, на русском, без точки, до 72 символов.
        Например: `feat: добавить поиск по профилям`.
        Не публикуйте подписки, токены, ключи, пароли и персональные данные, в том числе во вложениях.
  - type: textarea
    id: problem
    attributes:
      label: Проблема и сценарий использования
      description: Кому и в какой ситуации нужна функция? Что сейчас мешает решить задачу?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      description: Опишите действия пользователя и результат. Укажите целевую платформу и границы предложения.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии готовности
      description: По каким наблюдаемым результатам можно проверить, что задача решена?
      placeholder: |
        - [ ] Пользователь может…
        - [ ] При … приложение…
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
      description: Необязательно. Укажите обходные пути, ограничения и связанные issue. Для новой runtime-интеграции опишите место в архитектуре, контракт, безопасность, обновление и откат.
