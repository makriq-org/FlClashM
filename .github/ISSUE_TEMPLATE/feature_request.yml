name: Предложить изменение / Feature request
description: Новый Android-сценарий или улучшение поддерживаемой функции
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        FlClashM выпускается для Android и развивается в режиме дешёвой синхронизации с FlClashX. Опишите пользовательскую задачу и ограничения; конкретную реализацию можно обсудить после этого.

        Перед созданием запроса проверьте [существующие issues](https://github.com/makriq-org/FlClashM/issues?q=is%3Aissue). Не публикуйте приватный профиль, URL подписки или ключи.

  - type: textarea
    id: problem
    attributes:
      label: Какая задача сейчас не решается
      description: Кто сталкивается с ограничением, в каком Android-сценарии и как приходится обходить его сейчас.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Желаемый результат
      description: Как должно выглядеть поведение для пользователя или оператора профиля.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Android VPN и lifecycle
        - Профили и маршрутизация
        - NaiveProxy, ByeDPI или OlcRTC
        - Раздельное туннелирование
        - Обновления приложения
        - Интерфейс и доступность
        - Документация
        - Другое
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
      description: Какие решения уже проверялись; нужны ли изменения формата профиля, runtime binary, Android service или серверной стороны.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждение
      options:
        - label: Запрос относится к поддерживаемой Android-версии FlClashM.
          required: true
        - label: Я проверил похожие issues и не включил в описание секреты.
          required: true
