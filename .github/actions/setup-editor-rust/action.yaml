name: Setup editor Rust
description: Install the pinned editor toolchain and Android standard libraries
inputs:
  targets:
    description: Rust Android targets needed by this job
    required: false
    default: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
  install-host-deps:
    description: Install Linux desktop editor build dependencies
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # Flutter resolves native-hook compilers through ANDROID_NDK_HOME, whereas
    # our Go build uses ANDROID_NDK. Override the runner's preinstalled NDK too.
    - name: Select pinned NDK for Flutter native hooks
      if: runner.os == 'Linux' && env.ANDROID_NDK != ''
      shell: bash
      run: |
        test -d "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> "$GITHUB_ENV"
    - name: Install pinned Rust toolchain
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install 1.99.0 --profile minimal
        read -r -a targets <<< "$RUST_TARGETS"
        rustup target add --toolchain 1.99.0 "${targets[@]}"
        echo 'RUSTUP_TOOLCHAIN=1.99.0' >> "$GITHUB_ENV"
    - name: Install editor host build dependencies
      if: runner.os == 'Linux' && inputs.install-host-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libx11-dev libxkbcommon-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
