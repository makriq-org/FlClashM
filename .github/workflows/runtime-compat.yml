name: Runtime compatibility spike

on:
  workflow_dispatch:
  push:
    paths:
      - 'tool/runtime_compat/**'
      - '.github/workflows/runtime-compat.yml'
      - 'lib/product/runtime/*_release.dart'
  pull_request:
    paths:
      - 'tool/runtime_compat/**'
      - '.github/workflows/runtime-compat.yml'
      - 'lib/product/runtime/*_release.dart'

permissions:
  contents: read

jobs:
  runtime-compat:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            shell: bash
          - target: windows-x64
            runner: windows-2025
            shell: msys2
          - target: macos-x64
            runner: macos-15-intel
            shell: bash
          - target: macos-arm64
            runner: macos-14
            shell: bash

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go pinned by runtime contracts
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.4'
          check-latest: true

      - name: Set up MSYS2 toolchain
        if: matrix.shell == 'msys2'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            make
            git

      - name: Build runtime nodes (Unix)
        if: matrix.shell == 'bash'
        env:
          RUNTIME_COMPAT_OUT: ${{ github.workspace }}/runtime-compat-out
        run: tool/runtime_compat/build.sh --target '${{ matrix.target }}'

      - name: Smoke runtime nodes (Unix)
        if: matrix.shell == 'bash'
        env:
          RUNTIME_COMPAT_OUT: ${{ github.workspace }}/runtime-compat-out
        run: tool/runtime_compat/smoke.sh --target '${{ matrix.target }}'

      - name: Build runtime nodes (Windows)
        if: matrix.shell == 'msys2'
        shell: msys2 {0}
        env:
          RUNTIME_COMPAT_OUT: ${{ github.workspace }}/runtime-compat-out
        run: |
          export PATH="/c/hostedtoolcache/windows/go/1.26.4/x64/bin:$PATH"
          python tool/runtime_compat/runtime_compat.py build --target '${{ matrix.target }}'

      - name: Smoke runtime nodes (Windows)
        if: matrix.shell == 'msys2'
        shell: msys2 {0}
        env:
          RUNTIME_COMPAT_OUT: ${{ github.workspace }}/runtime-compat-out
        run: |
          export PATH="/c/hostedtoolcache/windows/go/1.26.4/x64/bin:$PATH"
          python tool/runtime_compat/runtime_compat.py smoke --target '${{ matrix.target }}'

      - name: Upload compatibility report and binaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-compat-${{ matrix.target }}
          path: runtime-compat-out/
          if-no-files-found: warn
          retention-days: 14
