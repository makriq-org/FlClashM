name: Desktop runtime artifacts

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tool/runtime_compat/**'
      - '.github/workflows/desktop-runtime-artifacts.yml'
      - 'lib/product/platform/product_install_layout.dart'
      - 'lib/product/runtime/*_release.dart'
      - 'core/**'
      - 'linux/CMakeLists.txt'
      - 'windows/CMakeLists.txt'
      - 'macos/Runner.xcodeproj/project.pbxproj'
      - 'macos/Helper/**'
      - 'macos/Updater/**'
      - 'macos/packaging/**'
      - 'test/product/platform/product_install_layout_test.dart'

permissions:
  contents: read

jobs:
  build-runtime-artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            shell: bash
          - target: windows-x64
            runner: windows-2025
            shell: msys2
          - target: macos-x64
            runner: macos-15-intel
            shell: bash
          - target: macos-arm64
            runner: macos-14
            shell: bash

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.4'
          check-latest: true

      - name: Set up MSYS2 toolchain
        if: matrix.shell == 'msys2'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            make
            git

      - name: Test install layout and inventory guards (Unix)
        if: matrix.shell == 'bash'
        run: python3 -m unittest tool/runtime_compat/test_runtime_compat.py

      - name: Test install layout and inventory guards (Windows)
        if: matrix.shell == 'msys2'
        shell: msys2 {0}
        run: python -m unittest tool/runtime_compat/test_runtime_compat.py

      - name: Build, smoke and verify bundle (Unix)
        if: matrix.shell == 'bash'
        env:
          RUNTIME_COMPAT_OUT: ${{ github.workspace }}/desktop-runtime-out
        run: |
          tool/runtime_compat/build.sh --target '${{ matrix.target }}'
          tool/runtime_compat/smoke.sh --target '${{ matrix.target }}'
          tool/runtime_compat/verify.sh --target '${{ matrix.target }}'

      - name: Build, smoke and verify bundle (Windows)
        if: matrix.shell == 'msys2'
        shell: msys2 {0}
        env:
          RUNTIME_COMPAT_OUT: ${{ github.workspace }}/desktop-runtime-out
        run: |
          export PATH="/c/hostedtoolcache/windows/go/1.26.4/x64/bin:$PATH"
          python tool/runtime_compat/runtime_compat.py build --target '${{ matrix.target }}'
          python tool/runtime_compat/runtime_compat.py smoke --target '${{ matrix.target }}'
          python tool/runtime_compat/runtime_compat.py verify --target '${{ matrix.target }}'

      - name: Set up Flutter for macOS app verification
        if: startsWith(matrix.target, 'macos-')
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Build complete macOS app bundle
        if: startsWith(matrix.target, 'macos-')
        run: |
          flutter pub get
          mkdir -p .dart_tool/desktop-runtime-assets
          ditto desktop-runtime-out/install .dart_tool/desktop-runtime-assets
          flutter build macos --release

      - name: Verify macOS helper and updater binaries
        if: startsWith(matrix.target, 'macos-')
        run: |
          app=build/macos/Build/Products/Release/FlClashM.app
          arch=$(uname -m)
          "$app/Contents/runtimes/macos/$arch/app.flclashm.client.helper" --self-test
          "$app/Contents/Resources/updater-handoff" --self-test

      - name: Exercise macOS helper install lifecycle
        if: startsWith(matrix.target, 'macos-')
        run: |
          source_app=build/macos/Build/Products/Release/FlClashM.app
          ci_app=/Applications/FlClashM.app
          cleanup() {
            sudo "$ci_app/Contents/Resources/helper/install-helper.sh" uninstall || true
            sudo rm -rf "$ci_app"
          }
          trap cleanup EXIT
          sudo rm -rf "$ci_app"
          sudo ditto "$source_app" "$ci_app"
          sudo "$ci_app/Contents/Resources/helper/install-helper.sh" install
          "$ci_app/Contents/runtimes/macos/$(uname -m)/app.flclashm.client.helper" --client-smoke
          sudo "$ci_app/Contents/Resources/helper/install-helper.sh" uninstall

      - name: Package macOS ZIP and DMG
        if: startsWith(matrix.target, 'macos-')
        run: macos/packaging/package.sh build/macos/Build/Products/Release/FlClashM.app macos-dist '${{ matrix.target }}'

      - name: Upload verified macOS packages
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-package-${{ matrix.target }}
          path: macos-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Record manual Gatekeeper release gate
        if: startsWith(matrix.target, 'macos-')
        run: echo "Gatekeeper first-launch UI is a manual release gate for this unsigned build."

      - name: Upload verified install layout
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desktop-runtime-${{ matrix.target }}
          path: desktop-runtime-out/install/runtimes/
          if-no-files-found: error
          retention-days: 14
