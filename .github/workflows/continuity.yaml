name: continuity

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  select-runner:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/select-ci-runner.yaml

  release-continuity:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.small }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Check release continuity
        run: dart tool/check_release_continuity.dart
