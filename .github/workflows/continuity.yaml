name: continuity

on:
  pull_request:
    paths:
      - ".github/workflows/build.yaml"
      - ".github/workflows/continuity.yaml"
      - ".github/release_template.md"
      - ".github/pre_release_template.md"
      - "android/app/build.gradle.kts"
      - "lib/common/constant.dart"
      - "pubspec.yaml"
      - "setup.dart"
      - "tool/check_android_release_artifacts.dart"
      - "tool/check_release_continuity.dart"
      - "tool/release_contract.dart"
      - "tool/release_continuity_baseline.json"
      - "tool/write_release_metadata.dart"
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/build.yaml"
      - ".github/workflows/continuity.yaml"
      - ".github/release_template.md"
      - ".github/pre_release_template.md"
      - "android/app/build.gradle.kts"
      - "lib/common/constant.dart"
      - "pubspec.yaml"
      - "setup.dart"
      - "tool/check_android_release_artifacts.dart"
      - "tool/check_release_continuity.dart"
      - "tool/release_contract.dart"
      - "tool/release_continuity_baseline.json"
      - "tool/write_release_metadata.dart"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-continuity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Check release continuity
        run: dart tool/check_release_continuity.dart
