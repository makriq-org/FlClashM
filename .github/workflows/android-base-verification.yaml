name: android-base-verification

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/go-backend
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: "28.0.13004108"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verification: ${{ steps.changes.outputs.verification }}
      android: ${{ steps.changes.outputs.android }}
      full-matrix: ${{ steps.changes.outputs.full-matrix }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect verification scope
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          verification=false
          android=false
          full_matrix=false
          e2e=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "$BASE_SHA" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            verification=true
            android=true
            full_matrix=true
            e2e=true
          else
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

            if grep -Eq '^(.github/workflows/|analysis_options\.yaml$|android/|assets/runtimes/|core/|lib/|pubspec\.(yaml|lock)$|setup\.dart$|test/(product|tool)/|tool/|CHANGELOG\.md$|\.github/(pre_)?release_template\.md$)' <<< "$changed_files"; then
              verification=true
            fi

            if grep -Eq '^(.github/workflows/android-base-verification\.yaml$|analysis_options\.yaml$|android/|assets/runtimes/|core/|lib/|pubspec\.(yaml|lock)$|setup\.dart$|test/(product|tool)/|tool/)' <<< "$changed_files"; then
              android=true
            fi

            if grep -Eq '^(.github/workflows/android-base-verification\.yaml$|android/|core/|assets/runtimes/|setup\.dart$|lib/product/runtime/)' <<< "$changed_files"; then
              full_matrix=true
            fi

            if grep -Eq '^(.github/workflows/android-base-verification\.yaml$|.github/scripts/run-android-emulator-e2e\.sh$|android/|core/|assets/runtimes/|setup\.dart$|lib/product/(android|runtime)/)' <<< "$changed_files"; then
              e2e=true
            fi
          fi

          {
            echo "verification=$verification"
            echo "android=$android"
            echo "full-matrix=$full_matrix"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"

  base-guards:
    needs: detect-changes
    if: needs.detect-changes.outputs.verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Check GitHub Actions pinning
        run: dart tool/check_actions_pinning.dart

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/pluralplay/FlClashX.git 2>/dev/null || \
            git remote set-url upstream https://github.com/pluralplay/FlClashX.git
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check product boundaries
        run: dart tool/check_product_boundaries.dart

      - name: Check release continuity
        run: dart tool/check_release_continuity.dart

      - name: Check base drift
        run: dart tool/check_base_drift.dart

      - name: Run product and tool tests
        run: flutter test test/product test/tool

      - name: Analyze application compile errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Run targeted analyze
        run: flutter analyze --fatal-infos lib/product test/product test/tool tool/check_actions_pinning.dart tool/check_product_boundaries.dart tool/check_release_continuity.dart tool/check_android_release_artifacts.dart tool/check_android_release_signing.dart tool/write_release_metadata.dart tool/release_contract.dart setup.dart lib/common/constant.dart lib/core_version.dart

  android-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"

      - name: Run Android unit tests
        working-directory: android
        run: |
          gradle \
            --no-daemon \
            --project-cache-dir="$RUNNER_TEMP/flclashm-gradle-project-cache" \
            -Pkotlin.project.persistent.dir="$RUNNER_TEMP/flclashm-kotlin-cache" \
            -Ptarget-platform=android-arm64 \
            -Ptarget=lib/main.dart \
            :app:testDebugUnitTest \
            :common:testDebugUnitTest \
            :service:testDebugUnitTest

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: core/go.sum

      - name: Build Android core smoke artifact
        run: dart setup.dart android --arch arm64 --out core

      - name: Build Android arm64 release smoke APK
        shell: bash
        run: |
          core_version=$(sed -n "s/^const String kCoreVersionFromSource = '\\(.*\\)';$/\\1/p" lib/core_version.dart)
          test -n "$core_version"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=APP_ENV=pre \
            --dart-define=CORE_VERSION="$core_version"

      - name: Assert smoke artifact exists
        run: test -f build/app/outputs/flutter-apk/app-release.apk

  android-extra-abi-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            target-platform: android-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: core/go.sum

      - name: Build Android core smoke artifact
        run: dart setup.dart android --arch ${{ matrix.arch }} --out core

      - name: Build Android release smoke APK
        shell: bash
        run: |
          core_version=$(sed -n "s/^const String kCoreVersionFromSource = '\(.*\)';$/\1/p" lib/core_version.dart)
          test -n "$core_version"
          flutter build apk \
            --release \
            --target-platform ${{ matrix.target-platform }} \
            --dart-define=APP_ENV=pre \
            --dart-define=CORE_VERSION="$core_version"

      - name: Assert smoke artifact exists
        run: test -f build/app/outputs/flutter-apk/app-release.apk

  android-emulator-e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: core/go.sum

      - name: Build x86_64 core and runtime assets
        run: dart setup.dart android --arch amd64 --out core

      - name: Build debug APK and instrumentation APK
        shell: bash
        run: |
          core_version=$(sed -n "s/^const String kCoreVersionFromSource = '\(.*\)';$/\1/p" lib/core_version.dart)
          test -n "$core_version"
          flutter build apk \
            --debug \
            --target-platform android-x64 \
            --dart-define=APP_ENV=pre \
            --dart-define=CORE_VERSION="$core_version"
          ./android/gradlew \
            --no-daemon \
            -p android \
            -Ptarget-platform=android-x64 \
            -Ptarget=lib/main.dart \
            :app:assembleDebugAndroidTest

      - name: Run Android runtime and VPN E2E
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 8G
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash .github/scripts/run-android-emulator-e2e.sh

      - name: Upload Android E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-e2e-diagnostics
          path: ${{ runner.temp }}/android-e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
