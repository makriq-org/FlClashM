name: build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEY_ALIAS != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CONTINUITY_RELEASE_REPOSITORY: makriq-org/FlClashM
  NDK_VERSION: "28.0.13004108"

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/pluralplay/FlClashX.git 2>/dev/null || \
            git remote set-url upstream https://github.com/pluralplay/FlClashX.git
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check product boundaries
        run: dart tool/check_product_boundaries.dart

      - name: Check release continuity
        run: |
          dart tool/check_release_continuity.dart \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-ref-name "${{ github.ref_name }}"

      - name: Check base drift
        run: dart tool/check_base_drift.dart

      - name: Run product and tool tests
        run: flutter test test/product test/tool

      - name: Run targeted analyze
        run: flutter analyze --fatal-infos lib/product test/product test/tool tool/check_product_boundaries.dart tool/check_release_continuity.dart tool/check_android_release_artifacts.dart tool/check_android_release_signing.dart tool/write_release_metadata.dart tool/release_contract.dart setup.dart lib/common/constant.dart lib/core_version.dart

  build:
    runs-on: ubuntu-latest
    needs: [release-guards]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Flutter version
        run: flutter --version

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.3"
          cache-dependency-path: core/go.sum

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android runtime assets
        run: dart setup.dart android --out runtime-assets

      - name: Build Android core artifacts
        run: dart setup.dart android --out core

      - name: Upload Android runtime assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-runtime-assets-android
          path: |
            assets/runtimes/byedpi
            assets/runtimes/naiveproxy
            assets/runtimes/olcrtc
          overwrite: true

      - name: Upload Android core artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-core-android
          path: |
            libclash/android
            lib/core_version.dart
          overwrite: true

  build-android-artifacts:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: split-apk
            artifact: artifact-android-split-apk
          - out: universal-apk
            artifact: artifact-android-universal-apk
          - out: appbundle
            artifact: artifact-android-appbundle
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android core artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-core-android
          path: .

      - name: Download Android runtime assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-runtime-assets-android
          path: .

      - name: Build Android ${{ matrix.out }} artifact
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          version_name="${GITHUB_REF_NAME#v}"
          dart setup.dart android \
            --out ${{ matrix.out }} \
            --env "$release_channel" \
            --version-name "$version_name"

      - name: Upload Android ${{ matrix.out }} artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.artifact }}
          path: ./dist
          overwrite: true

  package:
    runs-on: ubuntu-latest
    needs: [build-android-artifacts]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./dist/
          pattern: artifact-android-*
          merge-multiple: true

      - name: Assert Android release signing continuity
        run: dart tool/check_android_release_signing.dart dist/*.apk dist/*.aab

      - name: Generate release metadata
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/write_release_metadata.dart \
            --out dist/FlClashM-android-release-metadata.json \
            --github-ref-name "${{ github.ref_name }}" \
            --github-sha "${{ github.sha }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --release-channel "$release_channel"

      - name: Generate sha256
        run: |
          cd ./dist
          while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done < <(find . -type f -not -name "*.sha256" -print0)

      - name: Assert Android release artifacts
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/check_android_release_artifacts.dart \
            --dist dist \
            --release-channel "$release_channel" \
            --github-ref-name "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [package]
    if: always() && (needs.package.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./dist/
          pattern: artifact-android
          merge-multiple: true

      - name: Generate release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          extract_section() {
            local header="$1"
            awk -v header="$header" '
              $0 == "## " header { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }

          changelog_block=$(extract_section "${{ github.ref_name }}" | sed '/^[[:space:]]*$/d')
          if [ -z "$changelog_block" ]; then
            echo "Missing CHANGELOG.md section for ${{ github.ref_name }}" >&2
            exit 1
          fi

          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md > release.md
          else
            : > release.md
          fi

          {
            if [ "${{ env.IS_STABLE }}" == "true" ]; then
              printf '\n\n'
            fi
            printf '## Что изменилось\n\n'
            printf '%s\n' "$changelog_block"
          } >> release.md

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true

      - name: Prepare commit list for notification
        id: prepare_commits
        run: |
          main_commit=$(git log -1 --pretty=format:"%s" "${{ github.ref_name }}")
          other_commits=$(awk '
            $0 == "## Что изменилось" { capture = 1; next }
            capture && /^## / { exit }
            capture && /^- / { print }
          ' release.md | grep -v "^- ${main_commit}$" | head -n 9)
          commits="• ${main_commit}"
          if [ -n "$other_commits" ]; then
            commits="${commits}"$'\n'"${other_commits}"
          fi
          commits_escaped=$(echo "$commits" | jq -Rs .)
          echo "commits=$commits_escaped" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notifications
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID_1: ${{ secrets.TELEGRAM_CHANNEL_ID_1 }}
          TELEGRAM_CHANNEL_ID_2: ${{ secrets.TELEGRAM_CHANNEL_ID_2 }}
          TELEGRAM_CHANNEL_ID_3: ${{ secrets.TELEGRAM_CHANNEL_ID_3 }}
          VERSION: ${{ github.ref_name }}
          COMMITS: ${{ fromJSON(steps.prepare_commits.outputs.commits) }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          IS_STABLE: ${{ env.IS_STABLE }}
        run: |
          python3 -m pip install requests --quiet
          python3 .github/scripts/notify_telegram.py
