name: build

on:
  push:
    tags:
      - "v*"

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEY_ALIAS != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CONTINUITY_RELEASE_REPOSITORY: makriq-org/FlClashM

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check release continuity
        run: |
          dart tool/check_release_continuity.dart \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-ref-name "${{ github.ref_name }}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android release artifacts
        run: dart setup.dart android ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Assert Android release signing continuity
        run: dart tool/check_android_release_signing.dart dist/FlClashM-android-arm64-v8a.apk

      - name: Generate release metadata
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/write_release_metadata.dart \
            --out dist/FlClashM-android-release-metadata.json \
            --github-ref-name "${{ github.ref_name }}" \
            --github-sha "${{ github.sha }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --release-channel "$release_channel"

      - name: Generate sha256
        if: env.IS_STABLE == 'true'
        run: |
          cd ./dist
          while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done < <(find . -type f -not -name "*.sha256" -print0)

      - name: Assert Android release artifacts
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/check_android_release_artifacts.dart \
            --dist dist \
            --release-channel "$release_channel" \
            --github-ref-name "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  changelog:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        if: ${{ env.IS_STABLE == 'true' }}
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Generate
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          mapfile -t tags < <(git tag --merged "$(git rev-parse HEAD)" --sort=-creatordate)
          preTag=$(grep -oP '^## \K.*' CHANGELOG.md | head -n 1)
          currentTag=""
          for ((i = 0; i <= ${#tags[@]}; i++)); do
            if (( i < ${#tags[@]} )); then
              tag=${tags[$i]}
            else
              tag=""
            fi
            if [ -n "$currentTag" ]; then
              if [ "$(echo -e "$currentTag\n$preTag" | sort -V | head -n 1)" == "$currentTag" ]; then
                break
              fi
            fi
            if [ -n "$currentTag" ]; then
              echo "## $currentTag" >> NEW_CHANGELOG.md
              echo "" >> NEW_CHANGELOG.md
              if [ -n "$tag" ]; then
                git log --pretty=format:"%B" "$tag..$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> NEW_CHANGELOG.md
              else
                git log --pretty=format:"%B" "$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> NEW_CHANGELOG.md
              fi
              echo "" >> NEW_CHANGELOG.md
            fi
            currentTag=$tag
          done
          cat CHANGELOG.md >> NEW_CHANGELOG.md
          cat NEW_CHANGELOG.md > CHANGELOG.md

      - name: Commit
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git config --local user.email "141617622+makriq@users.noreply.github.com"
            git config --local user.name "makriq"
            git commit -m "Update changelog"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions:
      contents: write
    needs: [build]
    if: always() && (needs.build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-android
          merge-multiple: true

      - name: Generate release.md
        run: |
          curl --silent "https://api.github.com/repos/${CONTINUITY_RELEASE_REPOSITORY}/releases/latest" >/dev/null || true
          : > release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          else
            sed "s|VERSION|$version|g" ./.github/pre_release_template.md >> release.md
          fi

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true

      - name: Prepare commit list for notification
        id: prepare_commits
        run: |
          main_commit=$(git log -1 --pretty=format:"%s" "${{ github.ref_name }}")
          other_commits=$(head -n 20 release.md | grep "^- " | grep -v "^- ${main_commit}$" | head -n 9)
          commits="• ${main_commit}"
          if [ -n "$other_commits" ]; then
            commits="${commits}"$'\n'"${other_commits}"
          fi
          commits_escaped=$(echo "$commits" | jq -Rs .)
          echo "commits=$commits_escaped" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notifications
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID_1: ${{ secrets.TELEGRAM_CHANNEL_ID_1 }}
          TELEGRAM_CHANNEL_ID_2: ${{ secrets.TELEGRAM_CHANNEL_ID_2 }}
          TELEGRAM_CHANNEL_ID_3: ${{ secrets.TELEGRAM_CHANNEL_ID_3 }}
          VERSION: ${{ github.ref_name }}
          COMMITS: ${{ fromJSON(steps.prepare_commits.outputs.commits) }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          IS_STABLE: ${{ env.IS_STABLE }}
        run: |
          python3 -m pip install requests --quiet
          python3 .github/scripts/notify_telegram.py
