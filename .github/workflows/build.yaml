name: build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEY_ALIAS != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CONTINUITY_RELEASE_REPOSITORY: makriq-org/FlClashM
  NDK_VERSION: "28.0.13004108"

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/pluralplay/FlClashX.git 2>/dev/null || \
            git remote set-url upstream https://github.com/pluralplay/FlClashX.git
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check product boundaries
        run: dart tool/check_product_boundaries.dart

      - name: Check release continuity
        run: |
          dart tool/check_release_continuity.dart \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-ref-name "${{ github.ref_name }}"

      - name: Check base drift
        run: dart tool/check_base_drift.dart

      - name: Run product and tool tests
        run: flutter test test/product test/tool

      - name: Run targeted analyze
        run: flutter analyze --fatal-infos lib/product test/product test/tool tool/check_product_boundaries.dart tool/check_release_continuity.dart tool/check_android_release_artifacts.dart tool/check_android_release_signing.dart tool/write_release_metadata.dart tool/write_app_update_manifest.dart tool/release_contract.dart setup.dart lib/common/constant.dart lib/core_version.dart

  build:
    runs-on: ubuntu-latest
    needs: [release-guards]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Flutter version
        run: flutter --version

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.3"
          cache-dependency-path: core/go.sum

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android runtime assets
        run: dart setup.dart android --out runtime-assets

      - name: Build Android core artifacts
        run: dart setup.dart android --out core

      - name: Upload Android runtime assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-runtime-assets-android
          path: |
            assets/runtimes/byedpi
            assets/runtimes/naiveproxy
            assets/runtimes/olcrtc
          overwrite: true

      - name: Upload Android core artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-core-android
          path: |
            libclash/android
            lib/core_version.dart
          overwrite: true

  build-android-artifacts:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: split-apk
            artifact: artifact-android-split-apk
          - out: universal-apk
            artifact: artifact-android-universal-apk
          - out: appbundle
            artifact: artifact-android-appbundle
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup optional Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android core artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-core-android
          path: .

      - name: Download Android runtime assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-runtime-assets-android
          path: .

      - name: Build Android ${{ matrix.out }} artifact
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          version_name="${GITHUB_REF_NAME#v}"
          dart setup.dart android \
            --out ${{ matrix.out }} \
            --env "$release_channel" \
            --version-name "$version_name"

      - name: Upload Android ${{ matrix.out }} artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.artifact }}
          path: ./dist
          overwrite: true

  package:
    runs-on: ubuntu-latest
    needs: [build-android-artifacts]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./dist/
          pattern: artifact-android-*
          merge-multiple: true

      - name: Assert Android release signing continuity
        run: dart tool/check_android_release_signing.dart dist/*.apk dist/*.aab

      - name: Generate release metadata
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/write_release_metadata.dart \
            --out dist/FlClashM-android-release-metadata.json \
            --github-ref-name "${{ github.ref_name }}" \
            --github-sha "${{ github.sha }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --release-channel "$release_channel"

      - name: Generate sha256
        run: |
          cd ./dist
          while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done < <(find . -type f -not -name "*.sha256" -print0)

      - name: Assert Android release artifacts
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/check_android_release_artifacts.dart \
            --dist dist \
            --release-channel "$release_channel" \
            --github-ref-name "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [package]
    if: always() && (needs.package.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./dist/
          pattern: artifact-android
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          extract_section() {
            local header="$1"
            awk -v header="$header" '
              $0 == "## " header { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }

          changelog_block=$(extract_section "${{ github.ref_name }}" | sed '/^[[:space:]]*$/d')
          if [ -z "$changelog_block" ]; then
            echo "Missing CHANGELOG.md section for ${{ github.ref_name }}" >&2
            exit 1
          fi

          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md > release.md
          else
            : > release.md
          fi

          {
            if [ "${{ env.IS_STABLE }}" == "true" ]; then
              printf '\n\n'
            fi
            printf '## Что изменилось\n\n'
            printf '%s\n' "$changelog_block"
          } >> release.md

      - name: Require app update publishing secrets
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
        run: |
          if [ -z "$APP_UPDATE_SIGNING_KEY" ] || \
             [ -z "$SOURCEFORGE_SSH_KEY" ] || \
             [ -z "$SOURCEFORGE_USERNAME" ]; then
            echo "Tag releases require app update publishing secrets." >&2
            exit 1
          fi

      - name: Generate signed app update manifest
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          mkdir -p "${RUNNER_TEMP}/app-update"
          dart tool/write_app_update_manifest.dart \
            --dist dist \
            --out "${RUNNER_TEMP}/app-update/${release_channel}.json" \
            --release-notes release.md \
            --tag "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --channel "$release_channel" \
            --published-at "$published_at"

      - name: Configure verified SourceForge SSH access
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > "$HOME/.ssh/sourceforge"
          chmod 600 "$HOME/.ssh/sourceforge"
          : > "$HOME/.ssh/known_hosts"
          for host in frs.sourceforge.net web.sourceforge.net; do
            host_key=$(ssh-keyscan -t ed25519 "$host" 2>/dev/null)
            fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}' | sort -u)
            if [ "$fingerprint" != "SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY" ]; then
              echo "Unexpected SourceForge SSH host key for $host: $fingerprint" >&2
              exit 1
            fi
            printf '%s\n' "$host_key" >> "$HOME/.ssh/known_hosts"
          done

      - name: Publish Android update to SourceForge
        env:
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
        run: |
          ssh_options="-i $HOME/.ssh/sourceforge -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          release_relative_path="releases/${GITHUB_REF_NAME}"
          release_path="/home/frs/project/flclashm/${release_relative_path}"
          release_stage="${RUNNER_TEMP}/sourceforge-release"
          mkdir -p "${release_stage}/${release_relative_path}"
          cp -a dist/. "${release_stage}/${release_relative_path}/"
          rsync -av --checksum --ignore-existing --relative \
            -e "ssh $ssh_options" \
            "${release_stage}/./${release_relative_path}/" \
            "$SOURCEFORGE_USERNAME@frs.sourceforge.net:/home/frs/project/flclashm/"

          release_drift=$(rsync -rcn --delete --itemize-changes \
            -e "ssh $ssh_options" \
            dist/ \
            "$SOURCEFORGE_USERNAME@frs.sourceforge.net:${release_path}/")
          if [ -n "$release_drift" ]; then
            echo "SourceForge release directory is not immutable:" >&2
            printf '%s\n' "$release_drift" >&2
            exit 1
          fi

          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          manifest_root="${RUNNER_TEMP}/app-update"
          web_stage="${RUNNER_TEMP}/sourceforge-web"
          mkdir -p "${web_stage}/update"
          cp "${manifest_root}/${release_channel}.json" \
            "${manifest_root}/${release_channel}.json.sig" \
            "${web_stage}/update/"
          rsync -av --checksum --relative \
            -e "ssh $ssh_options" \
            "${web_stage}/./update/${release_channel}.json.sig" \
            "$SOURCEFORGE_USERNAME@web.sourceforge.net:/home/project-web/flclashm/htdocs/"
          rsync -av --checksum --relative \
            -e "ssh $ssh_options" \
            "${web_stage}/./update/${release_channel}.json" \
            "$SOURCEFORGE_USERNAME@web.sourceforge.net:/home/project-web/flclashm/htdocs/"

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true
