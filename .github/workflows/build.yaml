name: build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEY_ALIAS != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CONTINUITY_RELEASE_REPOSITORY: makriq-org/FlClashM
  NDK_VERSION: "28.0.13004108"

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/pluralplay/FlClashX.git 2>/dev/null || \
            git remote set-url upstream https://github.com/pluralplay/FlClashX.git
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check product boundaries
        run: dart tool/check_product_boundaries.dart

      - name: Check release continuity
        run: |
          dart tool/check_release_continuity.dart \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-ref-name "${{ github.ref_name }}"

      - name: Check base drift
        run: dart tool/check_base_drift.dart

      - name: Run product and tool tests
        run: flutter test test/product test/tool

      - name: Run targeted analyze
        run: flutter analyze --fatal-infos lib/product test/product test/tool tool/check_product_boundaries.dart tool/check_release_continuity.dart tool/check_android_release_artifacts.dart tool/check_android_release_signing.dart tool/write_release_metadata.dart tool/write_app_update_manifest.dart tool/write_desktop_update_catalog.dart tool/release_contract.dart setup.dart lib/common/constant.dart lib/core_version.dart

  build:
    runs-on: ubuntu-latest
    needs: [release-guards]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Flutter version
        run: flutter --version

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/go.sum

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android runtime assets
        run: dart setup.dart android --out runtime-assets

      - name: Build Android core artifacts
        run: dart setup.dart android --out core

      - name: Upload Android runtime assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-runtime-assets-android
          path: |
            assets/runtimes/byedpi
            assets/runtimes/naiveproxy
            assets/runtimes/olcrtc
            assets/runtimes/stormdns
          overwrite: true

      - name: Upload Android core artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-core-android
          path: |
            libclash/android
            lib/core_version.dart
          overwrite: true

  build-android-artifacts:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: split-apk
            artifact: artifact-android-split-apk
          - out: universal-apk
            artifact: artifact-android-universal-apk
          - out: appbundle
            artifact: artifact-android-appbundle
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Require continuity signing for tag releases
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "Tag releases must use the FlClash continuity signing secrets." >&2
          exit 1

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android core artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-core-android
          path: .

      - name: Download Android runtime assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-runtime-assets-android
          path: .

      - name: Build Android ${{ matrix.out }} artifact
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart setup.dart android \
            --out ${{ matrix.out }} \
            --env "$release_channel"

      - name: Upload Android ${{ matrix.out }} artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.artifact }}
          path: ./dist
          overwrite: true

  desktop-runtime-artifacts:
    needs: [release-guards]
    uses: ./.github/workflows/desktop-runtime-artifacts.yml

  build-desktop-artifacts:
    needs: [desktop-runtime-artifacts]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            runtime-root: build/linux/x64/release/bundle
            artifact: artifact-desktop-linux-x64
          - target: windows-x64
            runner: windows-2025
            runtime-root: build/windows/x64/runner/Release
            artifact: artifact-desktop-windows-x64
          - target: macos-x64
            runner: macos-15-intel
            runtime-root: build/macos/Build/Products/Release/FlClashM.app/Contents
            artifact: artifact-desktop-macos-x64
          - target: macos-arm64
            runner: macos-14
            runtime-root: build/macos/Build/Products/Release/FlClashM.app/Contents
            artifact: artifact-desktop-macos-arm64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download verified desktop runtime layout
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: desktop-runtime-${{ matrix.target }}
          path: .dart_tool/desktop-runtime-assets

      - name: Verify downloaded Linux runtime inventory
        if: matrix.target == 'linux-x64'
        env:
          RUNTIME_COMPAT_OUT: .dart_tool/desktop-runtime-assets
        run: python3 tool/runtime_compat/runtime_compat.py verify --target linux-x64

      - name: Verify downloaded Windows runtime inventory
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $env:RUNTIME_COMPAT_OUT = '.dart_tool/desktop-runtime-assets'
          python tool/runtime_compat/runtime_compat.py verify --target windows-x64

      - name: Verify downloaded macOS runtime inventory
        if: startsWith(matrix.target, 'macos-')
        env:
          RUNTIME_COMPAT_OUT: .dart_tool/desktop-runtime-assets
        run: python3 tool/runtime_compat/runtime_compat.py verify --target ${{ matrix.target }}

      - name: Build Linux desktop bundle
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cargo rpm appimagetool
          flutter build linux --release

      - name: Build Windows desktop bundle
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: flutter build windows --release

      - name: Build macOS desktop bundle
        if: startsWith(matrix.target, 'macos-')
        run: flutter build macos --release

      - name: Verify packaged Linux runtime inventory
        if: matrix.target == 'linux-x64'
        env:
          RUNTIME_COMPAT_OUT: ${{ matrix.runtime-root }}
        run: python3 tool/runtime_compat/runtime_compat.py verify --target linux-x64

      - name: Verify packaged Windows runtime inventory
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $env:RUNTIME_COMPAT_OUT = '${{ matrix.runtime-root }}'
          python tool/runtime_compat/runtime_compat.py verify --target windows-x64

      - name: Verify packaged macOS runtime inventory
        if: startsWith(matrix.target, 'macos-')
        env:
          RUNTIME_COMPAT_OUT: ${{ matrix.runtime-root }}
        run: python3 tool/runtime_compat/runtime_compat.py verify --target ${{ matrix.target }}

      - name: Archive Linux desktop bundle
        if: matrix.target == 'linux-x64'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/FlClashM-linux-x64.tar.gz bundle
          python3 tool/linux/package_linux.py \
            --bundle build/linux/x64/release/bundle \
            --out dist \
            --version "${GITHUB_REF_NAME#v}"

      - name: Archive Windows desktop bundle
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/FlClashM-windows-x64.zip'

      - name: Archive macOS desktop bundle
        if: startsWith(matrix.target, 'macos-')
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/FlClashM.app \
            dist/FlClashM-${{ matrix.target }}.zip

      - name: Upload packaged desktop bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.artifact }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  package:
    runs-on: ubuntu-latest
    needs: [build-android-artifacts, build-desktop-artifacts]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./dist/
          pattern: artifact-android-*
          merge-multiple: true

      - name: Download packaged Linux desktop artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: artifact-desktop-linux-x64
          path: ./dist/
          merge-multiple: true

      - name: Assert Android release signing continuity
        run: dart tool/check_android_release_signing.dart dist/*.apk dist/*.aab

      - name: Generate release metadata
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/write_release_metadata.dart \
            --out dist/FlClashM-android-release-metadata.json \
            --github-ref-name "${{ github.ref_name }}" \
            --github-sha "${{ github.sha }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --release-channel "$release_channel"

      - name: Generate sha256
        run: |
          cd ./dist
          while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done < <(find . -type f -not -name "*.sha256" -print0)

      - name: Assert Android release artifacts
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          dart tool/check_android_release_artifacts.dart \
            --dist dist \
            --release-channel "$release_channel" \
            --github-ref-name "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}"

      - name: Upload aggregated release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-release
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [package]
    if: always() && (needs.package.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download aggregated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./dist/
          pattern: artifact-release
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          extract_section() {
            local header="$1"
            awk -v header="$header" '
              $0 == "## " header { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }

          changelog_block=$(extract_section "${{ github.ref_name }}" | sed '/^[[:space:]]*$/d')
          if [ -z "$changelog_block" ]; then
            echo "Missing CHANGELOG.md section for ${{ github.ref_name }}" >&2
            exit 1
          fi

          tag="${{ github.ref_name }}"
          repo="${GITHUB_REPOSITORY}"
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            template=./.github/release_template.md
          else
            template=./.github/pre_release_template.md
          fi

          # Fill in version/tag/repo placeholders, then splice the changelog
          # bullets in at the {{CHANGES}} marker. The changelog block is injected
          # verbatim so its lines stay the only `- ` bullets — the update
          # dialog in the app renders exactly those and skips the rest.
          printf '%s\n' "$changelog_block" > changes.md
          sed -e "s|VERSION|$version|g" -e "s|TAG|$tag|g" -e "s|REPO|$repo|g" "$template" > release.tmpl
          awk '
            FNR == NR { changes = changes $0 ORS; next }
            index($0, "{{CHANGES}}") { printf "%s", changes; next }
            { print }
          ' changes.md release.tmpl > release.md
          rm -f changes.md release.tmpl

      - name: Require app update publishing secrets
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
        run: |
          if [ -z "$APP_UPDATE_SIGNING_KEY" ] || \
             [ -z "$SOURCEFORGE_SSH_KEY" ] || \
             [ -z "$SOURCEFORGE_USERNAME" ]; then
            echo "Tag releases require app update publishing secrets." >&2
            exit 1
          fi

      - name: Generate signed app update manifest
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          mkdir -p "${RUNNER_TEMP}/app-update"
          dart tool/write_app_update_manifest.dart \
            --dist dist \
            --out "${RUNNER_TEMP}/app-update/${release_channel}.json" \
            --release-notes release.md \
            --tag "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --channel "$release_channel" \
            --published-at "$published_at"

      - name: Generate signed desktop update catalog
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: |
          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          dart tool/write_desktop_update_catalog.dart \
            --dist dist \
            --out "${RUNNER_TEMP}/app-update/desktop/${release_channel}.json" \
            --release-notes release.md \
            --tag "${{ github.ref_name }}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --channel "$release_channel" \
            --published-at "$published_at"

      - name: Configure verified SourceForge SSH access
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > "$HOME/.ssh/sourceforge"
          chmod 600 "$HOME/.ssh/sourceforge"
          : > "$HOME/.ssh/known_hosts"
          for host in frs.sourceforge.net web.sourceforge.net; do
            host_key=$(ssh-keyscan -t ed25519 "$host" 2>/dev/null)
            fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}' | sort -u)
            if [ "$fingerprint" != "SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY" ]; then
              echo "Unexpected SourceForge SSH host key for $host: $fingerprint" >&2
              exit 1
            fi
            printf '%s\n' "$host_key" >> "$HOME/.ssh/known_hosts"
          done

      - name: Publish Android update to SourceForge
        env:
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
        run: |
          ssh_options="-i $HOME/.ssh/sourceforge -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          release_relative_path="releases/${GITHUB_REF_NAME}"
          release_path="/home/frs/project/flclashm/${release_relative_path}"
          release_stage="${RUNNER_TEMP}/sourceforge-release"
          mkdir -p "${release_stage}/${release_relative_path}"
          cp -a dist/. "${release_stage}/${release_relative_path}/"
          rsync -av --checksum --ignore-existing --relative \
            -e "ssh $ssh_options" \
            "${release_stage}/./${release_relative_path}/" \
            "$SOURCEFORGE_USERNAME@frs.sourceforge.net:/home/frs/project/flclashm/"

          release_drift=$(rsync -rcn --delete --itemize-changes \
            -e "ssh $ssh_options" \
            dist/ \
            "$SOURCEFORGE_USERNAME@frs.sourceforge.net:${release_path}/")
          if [ -n "$release_drift" ]; then
            echo "SourceForge release directory is not immutable:" >&2
            printf '%s\n' "$release_drift" >&2
            exit 1
          fi

          release_channel=pre
          if [ "${{ env.IS_STABLE }}" = "true" ]; then
            release_channel=stable
          fi
          manifest_root="${RUNNER_TEMP}/app-update"
          web_stage="${RUNNER_TEMP}/sourceforge-web"
          mkdir -p "${web_stage}/update"
          cp "${manifest_root}/${release_channel}.json" \
            "${manifest_root}/${release_channel}.json.sig" \
            "${web_stage}/update/"
          mkdir -p "${web_stage}/update/desktop"
          cp "${manifest_root}/desktop/${release_channel}.json" \
            "${manifest_root}/desktop/${release_channel}.json.sig" \
            "${web_stage}/update/desktop/"
          rsync -av --checksum --relative \
            -e "ssh $ssh_options" \
            "${web_stage}/./update/${release_channel}.json.sig" \
            "$SOURCEFORGE_USERNAME@web.sourceforge.net:/home/project-web/flclashm/htdocs/"
          rsync -av --checksum --relative \
            -e "ssh $ssh_options" \
            "${web_stage}/./update/${release_channel}.json" \
            "$SOURCEFORGE_USERNAME@web.sourceforge.net:/home/project-web/flclashm/htdocs/"
          rsync -av --checksum --relative \
            -e "ssh $ssh_options" \
            "${web_stage}/./update/desktop/${release_channel}.json.sig" \
            "$SOURCEFORGE_USERNAME@web.sourceforge.net:/home/project-web/flclashm/htdocs/"
          rsync -av --checksum --relative \
            -e "ssh $ssh_options" \
            "${web_stage}/./update/desktop/${release_channel}.json" \
            "$SOURCEFORGE_USERNAME@web.sourceforge.net:/home/project-web/flclashm/htdocs/"

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true
