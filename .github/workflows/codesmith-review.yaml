name: codesmith-review

# Only trusted workflow code runs here: never check out or execute PR contents.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions: {}

concurrency:
  group: codesmith-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: >-
      vars.CODESMITH_AUTO_REVIEW == 'true' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'codesmith-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Request Codesmith review once per commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
            const expectedSha = context.payload.pull_request.head.sha;
            if (pr.state !== 'open' || pr.draft || pr.head.sha !== expectedSha) {
              core.info('PR closed, draft, or event superseded; skipping.');
              return;
            }

            // External contributions need explicit maintainer approval before
            // they can consume agent credits. No PR text is put in the prompt.
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association);
            const approved = pr.labels.some(label => label.name === 'codesmith-review');
            if (!trusted && !approved) {
              core.info('A maintainer must add the codesmith-review label for this contribution.');
              return;
            }

            const marker = `<!-- codesmith-review:${pr.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) {
              core.info('Review already requested for this commit.');
              return;
            }

            const body = [
              '@codesmith-bot',
              '',
              `Проведи ревью PR на HEAD ${pr.head.sha}.`,
              'Соблюдай AGENTS.md и архитектурные контракты репозитория.',
              'Ищи ошибки поведения, безопасности и регрессии; пропусти косметические замечания.',
              'Для каждой находки укажи приоритет, файл, строку и сценарий ошибки.',
              'Отвечай по-русски. Укажи, какие проверки выполнены и какие не запускались.',
              'Только ревью: не изменяй код, не создавай коммиты и не включай Autofix.',
              '',
              marker,
            ].join('\n');
            const {data: comment} = await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
            await core.summary
              .addLink('Запрос ревью Codesmith', comment.html_url)
              .addRaw('\n\nЗапрос отправлен. Ответ агента и результат ревью проверяются отдельно.')
              .write();
