name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        id: gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "path=${RUNNER_TEMP}/gitleaks" >> "$GITHUB_OUTPUT"

      - name: Scan pushed commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITLEAKS: ${{ steps.gitleaks.outputs.path }}
        run: |
          if [ -z "$BASE_SHA" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            log_opts="$HEAD_SHA"
          else
            log_opts="$BASE_SHA..$HEAD_SHA"
          fi
          "$GITLEAKS" git \
            --log-opts="$log_opts" \
            --no-banner \
            --redact \
            --timeout=300 \
            --verbose \
            .
