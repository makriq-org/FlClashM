name: build-core
run-name: build-core ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Core version (e.g. v1.19.24)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: "28.0.13004108"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            abi: armeabi-v7a
          - arch: arm64
            abi: arm64-v8a
          - arch: amd64
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Update mihomo dependency
        run: |
          cd core
          go get github.com/metacubex/mihomo@${{ github.event.inputs.version }}
          go mod tidy

      - name: Build Android core
        run: dart setup.dart android --arch ${{ matrix.arch }} --out core

      - name: Pack Android core
        run: |
          mkdir -p dist
          zip -r "dist/FlClashCore-android-${{ matrix.abi }}.zip" \
            "libclash/android/${{ matrix.abi }}" \
            "libclash/android/includes/${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: core-android-${{ matrix.abi }}
          path: dist/FlClashCore-android-${{ matrix.abi }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "core-${{ github.event.inputs.version }}"
          name: "Android Core ${{ github.event.inputs.version }}"
          body: "Android shared core artifacts for ${{ github.event.inputs.version }}"
          prerelease: true
          files: dist/*
