name: build-core
run-name: build-core ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Core version (e.g. v1.19.24)"
        required: true

concurrency:
  group: build-core-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: "28.0.13004108"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            abi: armeabi-v7a
          - arch: arm64
            abi: arm64-v8a
          - arch: amd64
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Update mihomo dependency
        run: |
          cd core
          go get github.com/metacubex/mihomo@${{ github.event.inputs.version }}
          go mod tidy

      - name: Build Android core
        run: dart setup.dart android --arch ${{ matrix.arch }} --out core

      - name: Pack Android core
        run: |
          mkdir -p dist
          zip -r "dist/FlClashCore-android-${{ matrix.abi }}.zip" \
            "libclash/android/${{ matrix.abi }}" \
            "libclash/android/includes/${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-android-${{ matrix.abi }}
          path: dist/FlClashCore-android-${{ matrix.abi }}.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "core-${{ github.event.inputs.version }}"
          name: "Android Core ${{ github.event.inputs.version }}"
          body: "Android shared core artifacts for ${{ github.event.inputs.version }}"
          prerelease: true
          files: dist/*
