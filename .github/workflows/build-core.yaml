name: build-core
run-name: build-core ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Core version (e.g. v1.19.24)"
        required: true

concurrency:
  group: build-core-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: "28.0.13004108"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            abi: armeabi-v7a
          - arch: arm64
            abi: arm64-v8a
          - arch: amd64
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Update mihomo dependency
        run: |
          cd core
          go get github.com/metacubex/mihomo@${{ github.event.inputs.version }}
          go mod tidy

      - name: Build Android core
        run: dart setup.dart android --arch ${{ matrix.arch }} --out core

      - name: Pack Android core
        run: |
          mkdir -p dist
          zip -r "dist/FlClashCore-android-${{ matrix.abi }}.zip" \
            "libclash/android/${{ matrix.abi }}" \
            "libclash/android/includes/${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: core-android-${{ matrix.abi }}
          path: dist/FlClashCore-android-${{ matrix.abi }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: "core-${{ github.event.inputs.version }}"
          name: "Android Core ${{ github.event.inputs.version }}"
          body: "Android shared core artifacts for ${{ github.event.inputs.version }}"
          prerelease: true
          files: dist/*
