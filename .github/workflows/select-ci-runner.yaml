name: select-ci-runner
on:
  workflow_call:
    inputs:
      policy:
        type: string
        default: auto
    outputs:
      small:
        description: Runner for short maintenance and metadata jobs
        value: ${{ jobs.select.outputs.small }}
      medium:
        description: Runner for guards and unit tests
        value: ${{ jobs.select.outputs.medium }}
      large:
        description: Runner for native compilation and emulator jobs
        value: ${{ jobs.select.outputs.large }}
permissions: {}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    outputs:
      small: ${{ steps.probe.outputs.remote_run_id != '' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
      medium: ${{ steps.probe.outputs.remote_run_id != '' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
      large: ${{ steps.probe.outputs.remote_run_id != '' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe Blacksmith with bounded queue time
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_REF: ${{ github.head_ref || github.ref_name }}
          WORKER_WORKFLOW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          CAN_DISPATCH: ${{ vars.BLACKSMITH_DISABLED != 'true' && inputs.policy != 'github' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          RUNNER_PROBE: 'true'
        run: python3 .github/scripts/arm64_runner_fallback.py
