[package]
name = "helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "helper"
path = "src/main.rs"

[dependencies]
windows-service = { version = "0.8.1", optional = true }
tokio = { version = "1.53.2", features = ["full"] }
anyhow = "1.0.104"
warp = { version = "0.4.3", features = ["server"] }
serde = { version = "1.0.229", features = ["derive"] }
once_cell = "1.21.4"
sha2 = "0.11.0"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
