[package]
name = "helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "flclashm_helper"
path = "src/main.rs"

[dependencies]
windows-service = { version = "0.7.0", optional = true }
anyhow = "1.0.93"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
windows = { version = "0.58.0", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Pipes",
] }

[features]
default = []
windows-service = ["dep:windows-service", "dep:windows"]


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
