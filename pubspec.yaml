name: flclashx
description: FlClashM is an Android-only fork of FlClashX, with preserved Android package continuity from makriq.
publish_to: "none"
version: 0.3.1+2026101801

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  window_manager: ^0.5.2
  desktop_multi_window: ^0.3.1
  dynamic_color: ^2.1.0
  proxy:
    path: plugins/proxy
  window_ext:
    path: plugins/window_ext
  launch_at_startup: ^0.5.1
  json_annotation: ^4.12.0
  file_picker: ^11.0.3
  mobile_scanner: ^7.4.2
  app_links: ^7.2.2
  win32_registry: ^2.1.0
  # Keep the platform-channel release: newer versions add an unrelated native
  # desktop engine and require GTK headers even for the Android client tests.
  tray_manager: ^0.5.3
  qr_flutter: ^4.1.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.6.0
  network_info_plus: ^7.0.0
  collection: ^1.19.1
  animations: ^3.0.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.4
  webdav_client: ^1.2.2
  dio: ^5.11.1
  win32: ^5.15.0
  ffi: ^2.2.0
  archive: ^4.4.0
  lpinyin: ^2.0.3
  emoji_regex: ^0.0.5
  hotkey_manager: ^0.2.3
  uni_platform: ^0.1.3
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.1
  screen_retriever: ^0.2.2
  defer_pointer: ^0.0.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  flutter_js:
    git:
      url: https://github.com/chen08209/flutter_js
      ref: c0e10a5dab0e22cd616ec92ae71471d76369cbfe
  flutter_svg: ^2.3.0
  flutter_cache_manager: ^3.4.5
  cached_network_image: ^4.0.4
  crypto: ^3.0.7
  cryptography: ^2.9.0
  yaml: ^3.1.4
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  flutter_displaymode: ^0.7.0
  # In-app zashboard panel (Android/iOS/macOS; no Windows/Linux implementation —
  # those fall back to the external browser).
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  intl_utils: ^2.8.17
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatars/
    - assets/runtimes/byedpi/android/byebyeedpi-strategies.list
    - assets/images/icons/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
    - family: Icons
      fonts:
        - asset: assets/fonts/Icons.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf

ffigen:
  name: "ClashFFI"
  output: "lib/clash/generated/clash_ffi.dart"
  headers:
    entry-points:
      - "libclash/android/arm64-v8a/libclash.h"

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: arb
  output_dir: lib/l10n

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#202020"
  adaptive_icon_foreground: "assets/images/icon.png"
  adaptive_icon_monochrome: "assets/images/icon_white.png"
msix_config:
  display_name: FlClashX
  publisher_display_name: pluralplay
  publisher: CN=F778E60B-B797-4F7E-AE56-743F6A0F5B32
  identity_name: pluralplay.FlClashX
  msix_version: 0.4.2.0
  logo_path: assets/images/icon.png
  capabilities: internetClient, privateNetworkClientServer
  languages: en, ru, zh-CN
  store: true
