# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: ru-RU
tone_instructions: >-
  Пиши кратко и по существу. Для замечания укажи конкретный сценарий ошибки,
  последствия и минимальное исправление. Соблюдай AGENTS.md; избегай
  косметических правок и необязательных рефакторингов.

reviews:
  profile: chill
  poem: false
  request_changes_workflow: false
  # Временная область ревью PR #136 (лимит CodeRabbit 300 файлов).
  # Только generated/assets и точные импорты pinned upstream, включая удаления.
  # После завершения ревью блок удаляется; будущие правки UI остаются проверяемыми.
  path_filters:
    - "!assets/**"
    - "!lib/l10n/**"
    - "!**/generated/**"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!android/app/.gradle/config.properties"
    - "!android/app/src/main/kotlin/com/follow/clashx/DisplayModes.kt"
    - "!android/app/src/main/kotlin/com/follow/clashx/HighRefreshRate.kt"
    - "!android/app/src/main/res/drawable/ic_shortcut_start.xml"
    - "!android/app/src/main/res/drawable/ic_shortcut_stop.xml"
    - "!android/app/src/main/res/drawable/ic_shortcut_toggle.xml"
    - "!android/app/src/test/kotlin/com/follow/clashx/DisplayModesTest.kt"
